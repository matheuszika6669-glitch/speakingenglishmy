<title>Fala Inglês</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Conceito: o dia de estudo é um cartão de embarque; cada atividade é um portão. Trabalho e viagem são as duas rotas. */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#e6edf4; --ink:#0d2236; --muted:#53697c; --line:#d0dbe5;
  --accent:#1b5fc2; --accent-ink:#ffffff; --accent-soft:#dbe8fb; --warm:#c2410c; --warm-soft:#fde8dc;
  --good:#16794a; --good-soft:#d9f2e4; --warn:#9a6700; --bad:#b42318; --bad-soft:#fde4e1;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1520; --surface:#122232; --surface2:#1a2f43; --ink:#e8f0f7; --muted:#9bb0c2; --line:#2a425a;
    --accent:#6ea8ff; --accent-ink:#08121c; --accent-soft:#17304f; --warm:#ff9a5c; --warm-soft:#3a2418;
    --good:#5fd39a; --good-soft:#12362a; --warn:#f0c36a; --bad:#ff8f84; --bad-soft:#3d1c1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1520; --surface:#122232; --surface2:#1a2f43; --ink:#e8f0f7; --muted:#9bb0c2; --line:#2a425a;
  --accent:#6ea8ff; --accent-ink:#08121c; --accent-soft:#17304f; --warm:#ff9a5c; --warm-soft:#3a2418;
  --good:#5fd39a; --good-soft:#12362a; --warn:#f0c36a; --bad:#ff8f84; --bad-soft:#3d1c1a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
button,textarea,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:.68rem;color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.streak{font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:99px;white-space:nowrap}
.usage{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:right;margin-top:4px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding-bottom:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,.btn:focus-visible,.icon:focus-visible,.chip:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.9rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-width:36px;height:36px;padding:0 10px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{min-height:92px;resize:vertical}
.notice{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.notice.warn{background:var(--warm-soft);color:var(--ink)}
/* cartão de embarque */
.pass{background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.pass-top{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.route{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em}
.route span.arrow{flex:1;border-top:2px dashed var(--line);position:relative;min-width:24px}
.route span.arrow::after{content:"✈";position:absolute;right:-2px;top:-14px;font-size:1rem;color:var(--accent)}
.pass-meta{display:flex;gap:18px;flex-wrap:wrap}
.pass-meta div{display:flex;flex-direction:column}
.pass-meta b{font-family:var(--f-mono);font-weight:500;font-size:.95rem}
.perf{position:relative;border-top:2px dashed var(--line);height:0}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-11px}.perf::after{right:-11px}
.gates{list-style:none;margin:0;padding:6px 0}
.gate{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.gate:last-child{border-bottom:0}
.gcode{font-family:var(--f-mono);font-size:.78rem;background:var(--surface2);border-radius:6px;padding:4px 8px;white-space:nowrap}
.gate.done .gcode{background:var(--good-soft);color:var(--good)}
.gate .t{font-weight:700}
.gate .s{font-size:.9rem;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:.72rem;border-radius:99px;padding:3px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
details.words{padding:0 18px 14px}
details.words summary{cursor:pointer;color:var(--accent);font-weight:700;padding:4px 0}
.wlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.w{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.w b{display:block}
/* conversa */
.log{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:92%;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bubble.them{background:var(--surface2);align-self:flex-start;border-top-left-radius:4px}
.bubble.you{background:var(--accent-soft);align-self:flex-end;border-top-right-radius:4px}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fb h4{margin:0;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fix{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--warm-soft);border-radius:8px}
del{color:var(--bad);text-decoration-thickness:2px}
ins{color:var(--good);text-decoration:none;font-weight:700}
.phr{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;background:var(--surface2);border-radius:10px}
.phr .en{font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ok-w{color:var(--good);font-weight:700}.miss-w{color:var(--bad);text-decoration:underline wavy;font-weight:700}
.big{font-family:var(--f-display);font-size:1.35rem;line-height:1.3}
/* histórias */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.scard:hover{border-color:var(--accent)}
.story p{margin-bottom:12px;max-width:65ch}
.story{font-size:1.08rem}
.gl{display:flex;flex-wrap:wrap;gap:8px}
.gl span{background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.92rem}
.score{font-family:var(--f-display);font-size:2.4rem;font-weight:700}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:6px;background:var(--surface2)}
.dot.on{background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{background:var(--surface2);border-radius:12px;padding:12px}
.stat b{font-family:var(--f-display);font-size:1.7rem;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw;font-size:.92rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:520px){.brand small{display:none}.route{font-size:1.3rem}.gate{grid-template-columns:1fr auto}.gate .gcode{grid-column:1/-1;justify-self:start}}
</style>

function $(s,el){return (el||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayNum(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3800)}
function speak(text,slow){
  if(!('speechSynthesis' in window)){toast('Este navegador não tem voz para ouvir as frases.');return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang='en-US';
    var vs=speechSynthesis.getVoices();
    var v=vs.filter(function(x){return /^en[-_]US/i.test(x.lang)})[0]||vs.filter(function(x){return /^en/i.test(x.lang)})[0];
    if(v)u.voice=v;var base=[0.92,0.7,0.5][S.rate||0]||0.92;u.rate=slow?Math.min(base,0.6):base;speechSynthesis.speak(u);

function norm(w){return w.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]/g,'')}
function compare(target,said){
  var t=target.split(/\s+/),tn=t.map(norm),sn=said.split(/\s+/).map(norm).filter(Boolean);
  var n=tn.length,m=sn.length,dp=[],i,j;
  for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0))}
  for(i=1;i<=n;i++)for(j=1;j<=m;j++)dp[i][j]=tn[i-1]===sn[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var hit=new Array(n).fill(false);i=n;j=m;
  while(i>0&&j>0){if(tn[i-1]===sn[j-1]){hit[i-1]=true;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  var ok=hit.filter(Boolean).length;
  return {pct:n?Math.round(100*ok/n):0,html:t.map(function(w,k){return '<span class="'+(hit[k]?'ok-w':'miss-w')+'">'+esc(w)+'</span>'}).join(' ')};
}

 [/\bI have (\d+) years?\b(?! of)/gi,function(m){return {said:m[0],better:'I am '+m[1]+' years old',why:'Idade em inglês usa o verbo "to be" (I am), não "have".'}}],

function quickCheck(t){

  });

}

  if(ln.length){h+='<div><h4>Para falar melhor da próxima vez</h4><div style="display:flex;flex-direction:column;gap:6px">'+ln.map(function(l){return '<div class="phr"><div><div class="en">'+esc(l.en)+'</div><div class="small muted">'+esc(l.pt)+(l.example?' · '+esc(l.example):'')+'</div></div><span class="row"><button class="icon" data-act="say" data-t="'+esc(l.en)+'" aria-label="Ouvir">▶</button><button class="icon" data-act="add" data-en="'+esc(l.en)+'" data-pt="'+esc(l.pt)+'" aria-label="Salvar no caderno">＋</button></span></div>'}).join('')+'</div></div>'}
  var rp=arr(fb.repeat);
  if(rp.length){h+='<div><h4>Repita em voz alta</h4><div style="display:flex;flex-direction:column;gap:6px">'+rp.map(function(r){return '<div class="phr"><span class="en">'+esc(r)+'</span><span class="row"><button class="icon" data-act="say" data-t="'+esc(r)+'" aria-label="Ouvir">▶</button><button class="icon" data-act="add" data-en="'+esc(r)+'" data-pt="" aria-label="Salvar no caderno">＋</button></span></div>'}).join('')+'</div></div>'}
  return h+'</div>';
}
function drawLog(){
  var el=$('#log');if(!el||!convo)return;
  el.innerHTML=convo.turns.map(function(t){
    if(t.who==='them')return '<div class="bubble them"><div>'+esc(t.text)+'</div><div class="row"><button class="icon" data-act="say" data-t="'+esc(t.text)+'" aria-label="Ouvir">▶</button>'+(t.pt?'<span class="small muted">'+esc(t.pt)+'</span>':'')+'</div></div>';
    return '<div class="bubble you">'+esc(t.text)+'</div>'+(t.fb?fbHTML(t.fb):'')+(t.pending?'<div class="muted small"><span class="spin"></span>Claude está corrigindo…</div>':'')+(t.err?'<div class="notice warn">'+esc(t.err)+'</div>':'');
  }).join('');
}
function drawHelp(){
  var el=$('#helpbox');if(!el)return;
  if(mode!=='help'||!helpRes){el.innerHTML='';return}
  var h=helpRes;
  el.innerHTML='<div class="fb">'+arr(h.options).map(function(o){return '<div class="phr"><div><div class="en">'+esc(o.en)+'</div><div class="small muted">'+esc(o.tone)+(o.note?' · '+esc(o.note):'')+'</div></div><span class="row"><button class="icon" data-act="say" data-t="'+esc(o.en)+'" aria-label="Ouvir">▶</button><button class="icon" data-act="add" data-en="'+esc(o.en)+'" data-pt="" aria-label="Salvar">＋</button><button class="btn" data-act="use" data-en="'+esc(o.en)+'">Usar</button></span></div>'}).join('')+
    (h.pronunciation?'<div class="small"><b>Pronúncia:</b> '+esc(h.pronunciation)+'</div>':'')+
    (arr(h.key_words).length?'<div class="gl">'+arr(h.key_words).map(function(k){return '<span>'+esc(k.en)+' = '+esc(k.pt)+'</span>'}).join('')+'</div>':'')+'</div>';
}
function setBusy(on,id,label){busy=on;var b=$(id);if(b){b.disabled=on;b.innerHTML=on?'<span class="spin"></span>'+label:b.dataset.label||b.innerHTML}}
function sendTurn(){
  stopRec();
  var ta=$('#say'),text=ta.value.trim();if(!text||busy)return;
  var sc=SCEN.filter(function(x){return x.id===convo.sid})[0];
  var hist=convo.turns.slice(-8).map(function(t){return (t.who==='them'?'Partner: ':'Learner: ')+t.text}).join('\n');
  var turn={who:'you',text:text,pending:true};convo.turns.push(turn);ta.value='';drawLog();
  busy=true;var sb=$('#sendbtn');if(sb)sb.disabled=true;
  var prompt='You are a warm, encouraging English speaking coach for '+LEARNER+'.\nRole-play scenario: "'+sc.title+'". You play: '+sc.role+'.\nConversation so far:\n'+hist+'\n\nThe learner just said (it may be typed or a speech-to-text transcript, so ignore capitalization and punctuation, and they may mix in Portuguese words): "'+text+'"\n\nReply with ONLY one JSON object with these keys:\n"understood": true/false (could a native speaker understand it),\n"natural": the learner\'s sentence rewritten the way a native speaker would naturally say it, same meaning, simple words,\n"mistakes": array (max 3) of {"said": exact wrong part, "better": the fix, "why": short explanation in Brazilian Portuguese}; empty array if fine,\n"good": one specific thing they did well, in Brazilian Portuguese (short),\n"learn": array (max 3) of {"en": useful word or phrase they were missing, "pt": tradução, "example": a short example sentence in English},\n"repeat": array of 2 or 3 short English sentences (max 10 words each) for the learner to practice aloud, based on this turn,\n"reply": your next line in character, 1 to 3 short sentences in simple English that continues the conversation with a question,\n"reply_pt": Brazilian Portuguese translation of your reply.';
  ask(prompt).then(function(fb){
    turn.pending=false;turn.fb=fb||{};
    convo.turns.push({who:'them',text:(fb&&fb.reply)||'Could you say that again?',pt:(fb&&fb.reply_pt)||''});
    today().talk++;save();
  }).catch(function(e){turn.pending=false;turn.err=errMsg(e)||'Cancelado.'}).then(function(){
    busy=false;var b=$('#sendbtn');if(b)b.disabled=false;drawLog();render_header();
    var l=$('#log');if(l&&l.lastElementChild)l.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}
function render_header(){var n=streak();$('#streak').textContent=n+(n===1?' dia seguido':' dias seguidos')}
function helpMe(){
  stopRec();
  var ta=$('#say'),text=ta.value.trim();if(!text||busy)return;
  var sc=SCEN.filter(function(x){return x.id===convo.sid})[0];
  busy=true;var b=$('#sendbtn');b.disabled=true;b.innerHTML='<span class="spin"></span>Pensando…';
  var prompt='You help '+LEARNER+'. Scenario: "'+sc.title+'" (talking to '+sc.role+'). The learner wants to say this, in Portuguese: "'+text+'"\n\nReply with ONLY one JSON object: {"options": array of 3 objects {"en": a natural, simple English sentence they can say, "tone": one of "formal","neutro","informal", "note": very short tip in Brazilian Portuguese}, "pronunciation": one short tip in Brazilian Portuguese about the hardest sound or word stress in the best option (use Portuguese-style respelling for 1 or 2 words), "key_words": array of up to 4 {"en","pt"} important words used}.';
  ask(prompt).then(function(r){helpRes=r}).catch(function(e){toast(errMsg(e)||'Cancelado.')}).then(function(){busy=false;b.disabled=false;b.textContent='Me ajude a dizer';drawHelp()});
}

/* ---------- FRASES ---------- */
function deckList(){return deck==='hoje'?todayScen().phrases.map(function(p){return {en:p[0],pt:p[1]}}):S.notebook}
function vFrases(){
  var list=deckList();
  var pr='';
  if(practice){
    pr='<div class="card"><div class="label">Pratique esta frase</div><div class="big">'+esc(practice.en)+'</div>'+(practice.pt?'<div class="muted">'+esc(practice.pt)+'</div>':'')+
     '<div class="row"><button class="btn" data-act="say" data-t="'+esc(practice.en)+'">▶ Ouvir</button><button class="btn" data-act="say" data-slow="1" data-t="'+esc(practice.en)+'">🐢 Devagar</button></div>'+
     '<label class="label" for="rep">Agora diga em voz alta e escreva (ou dite) o que você disse</label><textarea id="rep" style="min-height:64px"></textarea>'+
     '<div class="row"><button class="btn" data-act="mic" id="micbtn">🎤 Falar</button><button class="btn primary" data-act="check">Conferir</button></div><div id="repres"></div></div>';
  }
  var rows=list.length?list.map(function(p,i){return '<div class="phr"><div><div class="en">'+esc(p.en)+'</div>'+(p.pt?'<div class="small muted">'+esc(p.pt)+'</div>':'')+'</div><span class="row"><button class="icon" data-act="say" data-t="'+esc(p.en)+'" aria-label="Ouvir">▶</button><button class="btn" data-act="prac" data-i="'+i+'">Praticar</button>'+(deck==='caderno'?'<button class="icon" data-act="del" data-i="'+i+'" aria-label="Remover">✕</button>':'<button class="icon" data-act="add" data-en="'+esc(p.en)+'" data-pt="'+esc(p.pt)+'" aria-label="Salvar no caderno">＋</button>')+'</span></div>'}).join(''):'<p class="muted">Seu caderno está vazio. Converse, leia histórias ou peça frases abaixo, e salve com ＋.</p>';
  $('#app').innerHTML=
   '<div class="card"><div class="row"><div class="seg"><button data-act="deck" data-d="hoje" aria-pressed="'+(deck==='hoje')+'">Frases de hoje</button><button data-act="deck" data-d="caderno" aria-pressed="'+(deck==='caderno')+'">Meu caderno ('+S.notebook.length+')</button></div></div></div>'+
   pr+
   '<div class="card"><div class="label">'+(deck==='hoje'?'Cenário: '+esc(todayScen().title):'Frases salvas')+'</div><div style="display:flex;flex-direction:column;gap:8px">'+rows+'</div></div>'+
   '<div class="card"><div class="label">Pedir frases novas ao Claude</div><label for="topic" class="small muted">Sobre o quê? Ex.: pedir um desconto, remarcar reunião, perder a conexão</label><input type="text" id="topic" placeholder="Assunto ou situação"><div class="row"><button class="btn primary" data-act="gen" id="genbtn">Gerar 6 frases</button></div><div id="genres" style="display:flex;flex-direction:column;gap:8px"></div></div>';
}
function checkRep(){
  stopRec();
  var ta=$('#rep'),said=ta.value.trim();if(!said||!practice)return;
  var r=compare(practice.en,said),d=today();
  if(r.pct>=85&&d.repList.indexOf(practice.en)<0){d.repList.push(practice.en);d.rep=d.repList.length;save();render_header()}
  $('#repres').innerHTML='<div class="notice"><b>'+r.pct+'% das palavras batem.</b> '+(r.pct>=85?'Boa! Conta como repetida hoje.':'Ouça de novo e tente outra vez.')+'<div style="margin-top:6px">'+r.html+'</div></div>';
}
function genPhrases(){
  var tp=$('#topic').value.trim();if(!tp||busy)return;
  busy=true;var b=$('#genbtn');b.disabled=true;b.innerHTML='<span class="spin"></span>Gerando…';
  var prompt='Give 6 useful, natural English sentences for '+LEARNER+', about: "'+tp+'". Short (max 12 words), practical for real work or travel situations. Reply with ONLY a JSON array of {"en": sentence, "pt": Brazilian Portuguese translation}.';
  ask(prompt).then(function(a){
    a=arr(a);$('#genres').innerHTML=a.map(function(p){return '<div class="phr"><div><div class="en">'+esc(p.en)+'</div><div class="small muted">'+esc(p.pt)+'</div></div><span class="row"><button class="icon" data-act="say" data-t="'+esc(p.en)+'" aria-label="Ouvir">▶</button><button class="icon" data-act="add" data-en="'+esc(p.en)+'" data-pt="'+esc(p.pt)+'" aria-label="Salvar">＋</button></span></div>'}).join('');
  }).catch(function(e){toast(errMsg(e)||'Cancelado.')}).then(function(){busy=false;b.disabled=false;b.textContent='Gerar 6 frases'});
}

/* ---------- HISTÓRIAS ---------- */
function vHistorias(){
  var a=allStories();
  if(openStory){var st=a.filter(function(x){return x.id===openStory})[0];if(st)return readStory(st);openStory=null}
  var cards=a.map(function(s){var r=S.stories[s.id];return '<button class="scard" data-act="open" data-id="'+s.id+'"><span class="label">'+(s.kind==='work'?'Trabalho':'Viagem')+' · '+esc(s.level)+(r?' · nota '+r.score+'/10':'')+'</span><h3>'+esc(s.title)+'</h3><span class="small muted">'+Math.max(1,Math.round(s.text.split(/\s+/).length/110))+' min de leitura</span></button>'}).join('');
  $('#app').innerHTML='<div class="card"><h2>Biblioteca de histórias</h2><p class="muted">Leia, ouça, escreva um resumo em inglês e o Claude confere se você entendeu certo e corrige o texto.</p></div><div class="grid">'+cards+'</div>'+
   '<div class="card"><div class="label">Criar uma história nova</div><div class="row"><input type="text" id="stopic" placeholder="Tema (ex.: um atraso de voo, uma reunião difícil)" style="flex:1 1 220px"><select id="slevel" style="flex:0 0 120px"><option>A2</option><option selected>B1</option><option>B2</option></select></div><div class="row"><button class="btn primary" data-act="newstory" id="nsbtn">Gerar história</button></div></div>';
}
function readStory(st){
  var paras=st.text.split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  var r=S.stories[st.id];
  $('#app').innerHTML=
   '<div class="row"><button class="btn" data-act="back">← Biblioteca</button></div>'+
   '<div class="card"><div class="label">'+(st.kind==='work'?'Trabalho':'Viagem')+' · nível '+esc(st.level)+'</div><h2>'+esc(st.title)+'</h2>'+
    '<div class="row"><button class="btn" data-act="say" data-t="'+esc(st.text.replace(/\n+/g,' '))+'">▶ Ouvir a história</button><button class="btn" data-act="say" data-slow="1" data-t="'+esc(st.text.replace(/\n+/g,' '))+'">🐢 Devagar</button></div>'+
    '<div class="story">'+paras+'</div>'+
    '<div><div class="label">Vocabulário</div><div class="gl" style="margin-top:6px">'+arr(st.gl).map(function(g){return '<span>'+esc(g[0])+' = '+esc(g[1])+'</span>'}).join('')+'</div></div></div>'+
   '<div class="card"><h3>Seu resumo</h3><p class="small muted">Conte a história com suas palavras, em inglês, em 3 a 5 frases. Sem olhar o texto, se puder.'+(r?' Última nota: <b>'+r.score+'/10</b>.':'')+'</p>'+
    '<textarea id="sum" placeholder="Write your summary here…"></textarea>'+
    '<div class="row"><button class="btn" data-act="mic" id="micbtn">🎤 Falar</button><button class="btn" data-act="freesum">Conferir grátis</button><button class="btn primary" data-act="eval" id="evbtn">Validar com Claude</button></div><div id="evres"></div></div>';
  drawEval();
}
function drawEval(){
  var el=$('#evres');if(!el||!lastEval||lastEval.id!==openStory)return;
  var e=lastEval.r;
  el.innerHTML='<div class="fb"><div class="row" style="justify-content:space-between"><div><div class="label">Nota</div><div class="score">'+esc(e.score)+'<span class="muted" style="font-size:1rem">/10</span></div></div><div style="flex:1 1 220px">'+esc(e.verdict)+'</div></div>'+
   (arr(e.covered).length?'<div><h4>Você contou certo</h4><ul>'+arr(e.covered).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':'')+
   (arr(e.missing).length?'<div><h4>Faltou</h4><ul>'+arr(e.missing).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':'')+
   (arr(e.wrong).length?'<div><h4>Não bate com a história</h4><ul>'+arr(e.wrong).map(function(x){return '<li><del>'+esc(x.said)+'</del> '+esc(x.fact)+'</li>'}).join('')+'</ul></div>':'')+
   (arr(e.language).length?'<div><h4>Inglês para corrigir</h4><div style="display:flex;flex-direction:column;gap:6px">'+arr(e.language).map(function(m){return '<div class="fix"><div><del>'+esc(m.said)+'</del> → <ins>'+esc(m.better)+'</ins></div><div class="small muted">'+esc(m.why)+'</div></div>'}).join('')+'</div></div>':'')+
   (e.improved?'<div><h4>Versão melhorada</h4><div class="row" style="justify-content:space-between"><span style="flex:1 1 260px">'+esc(e.improved)+'</span><button class="icon" data-act="say" data-t="'+esc(e.improved)+'" aria-label="Ouvir">▶</button></div></div>':'')+'</div>';
}
function evalSummary(){
  stopRec();
  var ta=$('#sum'),text=ta.value.trim();if(!text||busy)return;
  var st=allStories().filter(function(x){return x.id===openStory})[0];
  busy=true;var b=$('#evbtn');b.disabled=true;b.innerHTML='<span class="spin"></span>Conferindo…';
  var prompt='You are an English teacher for '+LEARNER+'. Below is a short story and the learner\'s summary of it (written or dictated; ignore capitalization and punctuation).\n\nSTORY:\n'+st.text+'\n\nLEARNER SUMMARY:\n'+text+'\n\nReply with ONLY one JSON object: {"score": integer 0-10 combining accuracy of content (most weight) and clarity of English, "verdict": 1-2 encouraging sentences in Brazilian Portuguese, "covered": array of key story points the learner got right (Portuguese, short), "missing": array of important points they left out (Portuguese, short), "wrong": array of {"said": what the learner wrote that does not match the story, "fact": what the story really says, in Portuguese}, "language": array (max 4) of {"said","better","why" (Portuguese, short)} for grammar/vocabulary mistakes, "improved": the learner\'s summary rewritten correctly in simple natural English, keeping their ideas}.';
  ask(prompt).then(function(r){
    var sc=Math.max(0,Math.min(10,Math.round(Number(r.score)||0)));r.score=sc;
    lastEval={id:openStory,r:r};S.stories[openStory]={score:sc,date:ymd(new Date())};today().story=true;save();render_header();
  }).catch(function(e){toast(errMsg(e)||'Cancelado.')}).then(function(){busy=false;b.disabled=false;b.textContent='Validar com Claude';drawEval()});
}
function newStory(){
  var tp=$('#stopic').value.trim()||'a day at work or on a trip',lv=$('#slevel').value;if(busy)return;
  busy=true;var b=$('#nsbtn');b.disabled=true;b.innerHTML='<span class="spin"></span>Escrevendo…';
  var prompt='Write a short story in simple English for '+LEARNER+', level '+lv+', about: "'+tp+'". 110 to 160 words, 3 short paragraphs, clear events, useful everyday vocabulary. Reply with ONLY one JSON object: {"title": 2-4 words, "kind": "work" or "travel", "text": the story with paragraphs separated by a blank line (\\n\\n), "gl": array of 5 [english word or phrase, Brazilian Portuguese translation], "kp": array of 4 or 5 {"pt": key plot point in Brazilian Portuguese (short), "kw": array of 2 to 4 lowercase English keywords or word stems that a correct summary would likely contain}}.';
  ask(prompt).then(function(r){
    if(!r||!r.text)throw {code:'invalid_json'};
    S.custom.unshift({id:'c'+Date.now(),kind:r.kind==='work'?'work':'travel',level:lv,title:String(r.title||'New Story'),text:String(r.text),gl:arr(r.gl),kp:arr(r.kp).filter(function(p){return p&&p.pt&&arr(p.kw).length}).map(function(p){return {pt:String(p.pt),kw:arr(p.kw).map(function(w){return String(w).toLowerCase()})}})});save();
  }).catch(function(e){toast(errMsg(e)||'Cancelado.')}).then(function(){busy=false;render()});
}

/* ---------- PROGRESSO ---------- */
function vProgresso(){
  var dots='',tot={talk:0,rep:0},d=new Date();d.setDate(d.getDate()-27);
  for(var i=0;i<28;i++){var k=ymd(d);dots+='<span class="dot'+(anyActivity(S.days[k])?' on':'')+'" title="'+k+'"></span>';d.setDate(d.getDate()+1)}
  Object.keys(S.days).forEach(function(k){tot.talk+=S.days[k].talk||0;tot.rep+=S.days[k].rep||0});
  var sc=Object.keys(S.stories).map(function(k){return S.stories[k].score});
  var avg=sc.length?(sc.reduce(function(a,b){return a+b},0)/sc.length).toFixed(1):'–';
  $('#app').innerHTML='<div class="card"><h2>Seu progresso</h2><div class="stat"><div><b>'+streak()+'</b><span class="muted small">dias seguidos</span></div><div><b>'+tot.talk+'</b><span class="muted small">mensagens corrigidas</span></div><div><b>'+tot.rep+'</b><span class="muted small">frases repetidas</span></div><div><b>'+S.notebook.length+'</b><span class="muted small">no caderno</span></div><div><b>'+Object.keys(S.usage||{}).reduce(function(a,k){return a+S.usage[k]},0)+'</b><span class="muted small">chamadas ao Claude (total)</span></div><div><b>'+sc.length+'</b><span class="muted small">resumos (média '+avg+')</span></div></div></div>'+
   '<div class="card"><div class="label">Últimos 28 dias</div><div class="dots">'+dots+'</div></div>'+
   '<div class="notice">Seu progresso fica salvo na sua conta quando o link é aberto logado no claude.ai, e também neste aparelho.</div>';
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var tab=ev.target.closest('#tabs button');if(tab){go(tab.dataset.v);return}
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='say')speak(el.dataset.t,!!el.dataset.slow);
  else if(a==='goto'){if(el.dataset.sid)startConvo(el.dataset.sid);if(el.dataset.story)openStory=el.dataset.story;view=el.dataset.v;go(view)}
  else if(a==='words'){today().words=true;save();render()}
  else if(a==='scen'){startConvo(el.dataset.sid);helpRes=null;render()}
  else if(a==='mode'){mode=el.dataset.m;helpRes=null;render()}
  else if(a==='send')sendTurn();
  else if(a==='help')helpMe();
  else if(a==='use'){mode='reply';helpRes=null;render();$('#say').value=el.dataset.en;$('#say').focus()}
  else if(a==='mic'){var t=$('#say')||$('#rep')||$('#sum');if(t)dictate(t,el)}
  else if(a==='add'){if(addPhrase(el.dataset.en,el.dataset.pt,'')&&view==='frases')render()}
  else if(a==='deck'){deck=el.dataset.d;practice=null;render()}
  else if(a==='prac'){practice=deckList()[Number(el.dataset.i)];render();window.scrollTo(0,0)}
  else if(a==='del'){S.notebook.splice(Number(el.dataset.i),1);save();render()}
  else if(a==='check')checkRep();
  else if(a==='gen')genPhrases();
  else if(a==='open'){openStory=el.dataset.id;lastEval=null;render();window.scrollTo(0,0)}
  else if(a==='back'){openStory=null;render()}
  else if(a==='eval')evalSummary();
  else if(a==='quick')showQuick('say','quick');
  else if(a==='freesum')freeSummary();
  else if(a==='newstory')newStory();
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)&&ev.target.id==='say'){mode==='reply'?sendTurn():helpMe()}
});
try{if('speechSynthesis' in window)speechSynthesis.getVoices()}catch(e){}
var h0=(location.hash||'').replace('#','');if(['hoje','conversar','frases','historias','progresso'].indexOf(h0)>=0)view=h0;
render();

$('#rate').addEventListener('change',function(){S.rate=Number(this.value);save();speak('This is the new speed.')});

/* capacidades do Claude (chegam depois do primeiro desenho) */
(function(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use('sample').then(function(s){sample=s;if(!s)toast('A correção com o Claude não está disponível neste modo de abertura.')}).catch(function(){});
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return;
      dbDoc=db.doc('data/users/'+id+'/progress');
      return dbDoc.get().then(function(snap){
        if(snap.exists){var d=snap.data();if(d&&(d.updated||0)>(S.updated||0)){S=Object.assign(S,JSON.parse(JSON.stringify(d)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}}
        else if(S.updated){save()}
      });
    });
  }).catch(function(){});
})();
